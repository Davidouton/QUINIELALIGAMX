name: NFL Predictor
on:
  workflow_dispatch:
  schedule:
    - cron: '17 11,17,23 * * *'
permissions:
  contents: read
concurrency:
  group: nfl-predictor
  cancel-in-progress: false
jobs:
  predict:
    # Enable only when the database schema and historical seed are ready.
    if: vars.NFL_PREDICTOR_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    defaults:
      run:
        working-directory: backend
    env:
      DATABASE_URL: ${{ secrets.NFL_PREDICTOR_DATABASE_URL }}
      THE_ODDS_API_KEY: ${{ secrets.THE_ODDS_API_KEY }}
      NFL_BOOKMAKER: draftkings
      PYTHONUNBUFFERED: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: python -m pip install -r requirements.txt
      - name: Actualizar resultados, estadísticas y predicciones
        run: python -m app.nfl_predictor.online run
